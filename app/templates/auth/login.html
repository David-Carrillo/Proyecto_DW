{% extends "base.html" %}
{% block titulo %}Acceso administradores{% endblock %}
{% block ancho %}angosto{% endblock %}
{% block contenido %}
<section class="tarjeta">
    <h1>Acceso administradores</h1>
    <form method="post" class="form-login" autocomplete="off">
        <div class="campo">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" value="{{ usuario or '' }}" required autofocus>
        </div>
        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="campo">
            <label for="captcha">Escriba el código de la imagen</label>
            <div class="captcha">
                <img id="imgCaptcha" src="{{ url_for('auth.imagen_captcha') }}" alt="Código captcha" width="190" height="64">
                <button type="button" class="boton-sec" id="recargarCaptcha" title="Otro código">↻</button>
            </div>
            <input type="text" id="captcha" name="captcha" maxlength="5" required
                   autocapitalize="characters" placeholder="Ej. K7MPA">
        </div>
        <div class="acciones">
            <button type="submit" class="boton">Entrar</button>
        </div>
    </form>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("recargarCaptcha").addEventListener("click", () => {
    document.getElementById("imgCaptcha").src = "{{ url_for('auth.imagen_captcha') }}?t=" + Date.now();
    document.getElementById("captcha").value = "";
});
</script>
{% endblock %}
